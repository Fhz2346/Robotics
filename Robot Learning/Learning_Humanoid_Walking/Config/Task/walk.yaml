name: walk
robot:
  name: jvrc_leg

dt:
  ctrl: 0.025
  sim: 0.001

len_obs_history: 1
action_smoothing: 0.5

goal_height_ref: 0.80
goal_speed_ref: 0.2 # change from outside
phase:
  swing: 0.75
  stance: 0.35
  strict_relaxer: 0.1
  stance_mode: "grounded"
desired_max_foot_frc: # change from outside
desired_max_foot_vel: 0.2

info:
  dA: 
  dS: 

rl:
  type: ppo
  
  network:
    actor:
      type: Gaussian_FF_Actor
      layers: [256, 256]
      std_dev: 0.223
      learn_std: False
      bounded: False
      normc_init: True

    critic:
      type: FF_V
      layers: [256, 256]
      normc_init: True

  gamma: 0.99
  sample:
    deterministic: False
    batch_size: 400
    n_proc: 1
    max_traj_len: # batch size / n_proc


  train:
    n_itr: 20000
    lr: 1e-4
    eps: 1e-5
    epochs: 3

    sampler:
      minibatch_size: 64

    update_ac:
      max_grad_norm: 0.05
      clip: 0.2
      coeff:
        entropy: 0

    eval_freq: 100